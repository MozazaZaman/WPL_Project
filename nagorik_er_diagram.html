<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagorik Sheba — ER Diagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Courier New',monospace;
  background:#0d1117;color:#c9d1d9;
  overflow:hidden;width:100vw;height:100vh;
}

/* ── TOOLBAR ── */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:#161b22;border-bottom:1px solid #30363d;
  display:flex;align-items:center;padding:0 16px;gap:10px;z-index:100;
}
#toolbar h1{font-size:13px;font-weight:700;color:#58a6ff;letter-spacing:1px;margin-right:8px;}
.tb-btn{
  background:#21262d;border:1px solid #30363d;color:#c9d1d9;
  font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;
  font-family:'Courier New',monospace;transition:all .15s;
  display:flex;align-items:center;gap:5px;
}
.tb-btn:hover{background:#30363d;border-color:#58a6ff;color:#58a6ff;}
.tb-btn.danger:hover{background:#3d1a1a;border-color:#f85149;color:#f85149;}
.tb-sep{width:1px;height:24px;background:#30363d;margin:0 4px;}
#zoom-display{font-size:11px;color:#8b949e;min-width:40px;text-align:center;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* ── CANVAS ── */
#canvas-wrap{
  position:fixed;top:48px;left:0;right:0;bottom:0;
  overflow:hidden;cursor:grab;
}
#canvas-wrap.grabbing{cursor:grabbing;}
#canvas{position:absolute;transform-origin:0 0;}

/* ── TABLE CARDS ── */
.er-table{
  position:absolute;
  background:#161b22;
  border:1.5px solid #30363d;
  border-radius:8px;
  min-width:260px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  user-select:none;
  transition:box-shadow .15s;
}
.er-table:hover{box-shadow:0 8px 32px rgba(88,166,255,.15);}
.er-table.selected{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.2);}

.er-table-header{
  padding:8px 12px;border-radius:6px 6px 0 0;
  display:flex;align-items:center;gap:8px;cursor:move;
}
.er-table-icon{font-size:14px;}
.er-table-name{font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;}
.er-table-count{font-size:9px;color:rgba(255,255,255,.5);margin-left:auto;}

.er-field{
  display:flex;align-items:center;gap:0;
  padding:4px 10px;border-top:1px solid #21262d;
  font-size:10px;cursor:pointer;transition:background .1s;
}
.er-field:hover{background:#21262d;}
.er-field:last-child{border-radius:0 0 6px 6px;}
.field-key{
  width:28px;font-size:9px;font-weight:700;
  color:#f0883e;flex-shrink:0;
}
.field-key.fk{color:#a371f7;}
.field-key.uk{color:#3fb950;}
.field-name{flex:1;color:#c9d1d9;font-weight:500;}
.field-type{color:#8b949e;font-size:9px;margin-left:6px;}
.field-note{color:#8b949e;font-size:8px;margin-left:6px;font-style:italic;}

/* ── SVG LINES ── */
#lines-svg{
  position:absolute;top:0;left:0;
  pointer-events:none;overflow:visible;
}
.er-line{stroke:#30363d;stroke-width:1.5;fill:none;}
.er-line.one-to-many{stroke:#58a6ff;}
.er-line.optional{stroke:#a371f7;stroke-dasharray:5,3;}
.cardinality-label{
  font-size:9px;fill:#8b949e;
  font-family:'Courier New',monospace;font-weight:700;
}

/* ── EDIT MODAL ── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;z-index:200;
}
#modal-overlay.open{display:flex;}
#modal{
  background:#161b22;border:1px solid #30363d;border-radius:10px;
  width:520px;max-height:80vh;overflow-y:auto;
  padding:20px;
}
#modal h2{font-size:14px;font-weight:700;color:#58a6ff;margin-bottom:16px;}
.modal-section{margin-bottom:16px;}
.modal-section label{font-size:11px;color:#8b949e;display:block;margin-bottom:5px;}
.modal-input{
  width:100%;background:#0d1117;border:1px solid #30363d;
  color:#c9d1d9;padding:7px 10px;border-radius:6px;
  font-size:11px;font-family:'Courier New',monospace;
}
.modal-input:focus{outline:none;border-color:#58a6ff;}
.modal-select{
  background:#0d1117;border:1px solid #30363d;
  color:#c9d1d9;padding:6px 8px;border-radius:6px;
  font-size:11px;font-family:'Courier New',monospace;cursor:pointer;
}
.modal-btn{
  background:#238636;border:1px solid #2ea043;color:#fff;
  padding:7px 16px;border-radius:6px;cursor:pointer;font-size:11px;
  font-family:'Courier New',monospace;margin-right:8px;
}
.modal-btn.cancel{background:#21262d;border-color:#30363d;color:#c9d1d9;}
.modal-btn.del{background:#b91c1c;border-color:#f85149;}
.field-edit-row{
  display:flex;gap:6px;align-items:center;
  margin-bottom:6px;padding:6px 8px;
  background:#0d1117;border:1px solid #21262d;border-radius:6px;
}
.field-edit-row input,.field-edit-row select{
  background:#161b22;border:1px solid #30363d;color:#c9d1d9;
  padding:4px 7px;border-radius:4px;font-size:10px;
  font-family:'Courier New',monospace;
}
.field-edit-row input{flex:1;}
.field-edit-row .del-field{
  background:none;border:none;color:#f85149;cursor:pointer;font-size:14px;padding:0 4px;
}
.add-field-btn{
  background:#0d1117;border:1px dashed #30363d;color:#58a6ff;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-size:10px;
  font-family:'Courier New',monospace;width:100%;margin-top:4px;
}
.add-field-btn:hover{border-color:#58a6ff;}

/* ── MINI MAP ── */
#minimap{
  position:fixed;bottom:16px;right:16px;
  width:160px;height:100px;
  background:#161b22;border:1px solid #30363d;border-radius:6px;
  overflow:hidden;z-index:100;
}
#minimap-canvas{width:100%;height:100%;}

/* ── TOOLTIP ── */
#tooltip{
  position:fixed;background:#161b22;border:1px solid #30363d;
  border-radius:6px;padding:6px 10px;font-size:10px;color:#c9d1d9;
  pointer-events:none;z-index:150;display:none;max-width:220px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <h1>◆ NAGORIK SHEBA — ER DIAGRAM</h1>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="addTable()">＋ Add Table</button>
  <button class="tb-btn" onclick="addRelation()">⟷ Add Relation</button>
  <button class="tb-btn" onclick="autoLayout()">⊞ Auto Layout</button>
  <div class="tb-sep"></div>

<!-- CANVAS -->

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- EDIT MODAL -->
<div id="modal-overlay">

    <div class="modal-section">

<script>

    fields:[

      {name:'zone_id',               type:'VARCHAR',  key:'FK', note:'→ DESTINATION_ZONE'},

let relations = [
  {from:'CITIZEN',     to:'COMPLAINT',        fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'COMPLAINT',   to:'CATEGORY',         fromCard:'*', toCard:'1', style:'one-to-many'},
  {from:'COMPLAINT',   to:'DESTINATION_ZONE', fromCard:'*', toCard:'1', style:'one-to-many'},
  {from:'COMPLAINT',   to:'STAFF',            fromCard:'*', toCard:'0..1', style:'optional'},
  {from:'COMPLAINT',   to:'COMPLAINT',        fromCard:'*', toCard:'0..1', style:'optional', label:'self-ref'},
  {from:'DESTINATION_ZONE', to:'EMERGENCY_CONTACT', fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'DESTINATION_ZONE', to:'PUBLIC_TOILET',     fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'DESTINATION_ZONE', to:'STAFF',             fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'PUBLIC_TOILET',    to:'TOILET_RATING',     fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'CITIZEN',          to:'TOILET_RATING',     fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'CITIZEN',          to:'NOTIFICATION',      fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'COMPLAINT',        to:'NOTIFICATION',      fromCard:'1', toCard:'*', style:'one-to-many'},
  {from:'STAFF',            to:'PUBLIC_TOILET',     fromCard:'0..1', toCard:'*', style:'optional', label:'added_by'},
];

// ═══════════════════════════════════════════════════════
// CANVAS PAN + ZOOM
// ═══════════════════════════════════════════════════════
let cam = {x:0, y:0, z:1};
let draggingCanvas = false, lastMouse = {x:0,y:0};
let draggingTable = null, dragOffset = {x:0,y:0};
let editingTable = null;
let addingRelation = false, relFrom = null;

const wrap = document.getElementById('canvas-wrap');
const canv = document.getElementById('canvas');
const svg  = document.getElementById('lines-svg');

function applyCamera(){
  canv.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  svg.style.transform  = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  document.getElementById('zoom-display').textContent = Math.round(cam.z*100)+'%';
}

wrap.addEventListener('mousedown', e=>{
  if(e.target === wrap || e.target === canv || e.target === svg){
    draggingCanvas=true;
    lastMouse={x:e.clientX,y:e.clientY};
    wrap.classList.add('grabbing');
  }
});
window.addEventListener('mousemove', e=>{
  if(draggingCanvas){
    cam.x += e.clientX - lastMouse.x;
    cam.y += e.clientY - lastMouse.y;
    lastMouse={x:e.clientX,y:e.clientY};
    applyCamera();
  }
  if(draggingTable){
    let mx = (e.clientX - cam.x) / cam.z;
    let my = (e.clientY - cam.y - 48) / cam.z;
    draggingTable.x = mx - dragOffset.x;
    draggingTable.y = my - dragOffset.y;
    renderAll();
  }
});
window.addEventListener('mouseup', ()=>{
  draggingCanvas=false;
  draggingTable=null;
  wrap.classList.remove('grabbing');
});
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  let factor = e.deltaY < 0 ? 1.1 : 0.9;
  let rect = wrap.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  cam.x = mx - (mx - cam.x) * factor;
  cam.y = my - (my - cam.y) * factor;
  cam.z = Math.max(0.2, Math.min(2.5, cam.z * factor));
  applyCamera();
},{passive:false});

function zoomIn(){cam.z=Math.min(2.5,cam.z*1.2);applyCamera();}
function zoomOut(){cam.z=Math.max(0.2,cam.z/1.2);applyCamera();}
function resetView(){cam={x:40,y:20,z:0.75};applyCamera();}

// ═══════════════════════════════════════════════════════
// RENDER TABLES
// ═══════════════════════════════════════════════════════
function renderAll(){
  canv.innerHTML='';
  svg.innerHTML='';
  tables.forEach(renderTable);
  relations.forEach(renderRelation);
}

function getTableEl(id){ return document.getElementById('tbl-'+id); }
function getTableRect(t){
  const el = getTableEl(t.id);
  if(!el) return null;
  return {
    x: t.x, y: t.y,
    w: el.offsetWidth || 280,
    h: el.offsetHeight || 100
  };
}

function renderTable(t){
  const div = document.createElement('div');
  div.className = 'er-table';
  div.id = 'tbl-'+t.id;
  div.style.left = t.x+'px';
  div.style.top  = t.y+'px';

  // header
  const hdr = document.createElement('div');
  hdr.className='er-table-header';
  hdr.style.background=t.color;
  hdr.innerHTML=`<span class="er-table-icon">▦</span>
    <span class="er-table-name">${t.name}</span>
    <span class="er-table-count">${t.fields.length} cols</span>`;
  hdr.addEventListener('mousedown', e=>{
    e.stopPropagation();
    let mx = (e.clientX - cam.x) / cam.z;
    let my = (e.clientY - cam.y - 48) / cam.z;
    draggingTable = t;
    dragOffset = {x: mx - t.x, y: my - t.y};
  });
  hdr.addEventListener('dblclick', e=>{
    e.stopPropagation();
    openModal(t);
  });
  div.appendChild(hdr);

  // fields
  t.fields.forEach((f,fi)=>{
    const row = document.createElement('div');
    row.className='er-field';
    let keyClass = f.key==='FK'?'fk': f.key==='UK'?'uk':'';
    row.innerHTML=`
      <span class="field-key ${keyClass}">${f.key||''}</span>
      <span class="field-name">${f.name}</span>
      <span class="field-type">${f.type}</span>
      ${f.note?`<span class="field-note">${f.note}</span>`:''}`;
    row.addEventListener('mouseenter', e=>{
      if(f.note){
        const tt=document.getElementById('tooltip');
        tt.textContent=f.note;
        tt.style.display='block';
        tt.style.left=(e.clientX+10)+'px';
        tt.style.top=(e.clientY-28)+'px';
      }
    });
    row.addEventListener('mouseleave', ()=>{
      document.getElementById('tooltip').style.display='none';
    });
    div.appendChild(row);
  });

  if(addingRelation){
    div.style.cursor='crosshair';
    div.addEventListener('click', e=>{
      e.stopPropagation();
      if(!relFrom){ relFrom=t; div.classList.add('selected'); }
      else if(relFrom.id!==t.id){
        relations.push({from:relFrom.id,to:t.id,fromCard:'1',toCard:'*',style:'one-to-many'});
        addingRelation=false; relFrom=null;
        document.querySelectorAll('.er-table').forEach(el=>el.classList.remove('selected'));
        renderAll();
      }
    });
  }

  canv.appendChild(div);
}

// ═══════════════════════════════════════════════════════
// RENDER RELATIONS
// ═══════════════════════════════════════════════════════
function renderRelation(rel){
  const fromT = tables.find(t=>t.id===rel.from);
  const toT   = tables.find(t=>t.id===rel.to);
  if(!fromT||!toT) return;

  // wait for DOM
  const fromEl = document.getElementById('tbl-'+fromT.id);
  const toEl   = document.getElementById('tbl-'+toT.id);
  if(!fromEl||!toEl) return;

  const fw = fromEl.offsetWidth||280, fh = fromEl.offsetHeight||100;
  const tw = toEl.offsetWidth||280,   th = toEl.offsetHeight||100;

  // self-referencing
  if(rel.from===rel.to){
    const cx=fromT.x+fw+40, cy=fromT.y+fh/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','er-line '+(rel.style||'one-to-many'));
    path.setAttribute('d',
      `M${fromT.x+fw},${fromT.y+fh*0.4} C${cx+20},${fromT.y+fh*0.4} ${cx+20},${fromT.y+fh*0.6} ${fromT.x+fw},${fromT.y+fh*0.6}`
    );
    path.setAttribute('marker-end','url(#arrowhead)');
    svg.appendChild(path);
    addLabel(fromT.x+fw+8, fromT.y+fh*0.5, rel.toCard||'*');
    return;
  }

  // center-to-center, then clamp to border
  const fx=fromT.x+fw/2, fy=fromT.y+fh/2;
  const tx=toT.x+tw/2,   ty=toT.y+th/2;
  const {x:x1,y:y1}=borderPoint(fromT.x,fromT.y,fw,fh,tx,ty);
  const {x:x2,y:y2}=borderPoint(toT.x,toT.y,tw,th,fx,fy);

  const dx=x2-x1, dy=y2-y1;
  const mx=x1+dx*0.45, my=y1+dy*0.45;

  // add arrowhead marker once
  if(!svg.querySelector('#arrowhead')){
    const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
    defs.innerHTML=`
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
      </marker>
      <marker id="arrowopt" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#a371f7"/>
      </marker>`;
    svg.appendChild(defs);
  }

  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','er-line '+(rel.style||'one-to-many'));
  path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
  path.setAttribute('marker-end', rel.style==='optional'?'url(#arrowopt)':'url(#arrowhead)');
  svg.appendChild(path);

  // cardinality labels
  addLabel(x1+Math.sign(dx)*22, y1+Math.sign(dy)*4, rel.fromCard||'1');
  addLabel(x2-Math.sign(dx)*22, y2-Math.sign(dy)*4, rel.toCard||'*');
  if(rel.label) addLabel((x1+x2)/2, (y1+y2)/2-8, rel.label, '#8b949e');
}

function borderPoint(rx,ry,rw,rh,tx,ty){
  const cx=rx+rw/2, cy=ry+rh/2;
  const dx=tx-cx, dy=ty-cy;
  const sx=rw/2, sy=rh/2;
  if(dx===0&&dy===0) return{x:cx,y:cy};
  const absDx=Math.abs(dx), absDy=Math.abs(dy);
  if(absDx*sy >= absDy*sx){
    // hit left or right
    const s=sx/absDx;
    return{x:cx+dx*s, y:cy+dy*s};
  } else {
    const s=sy/absDy;
    return{x:cx+dx*s, y:cy+dy*s};
  }
}

function addLabel(x,y,text,fill='#58a6ff'){
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x);t.setAttribute('y',y);
  t.setAttribute('class','cardinality-label');
  t.setAttribute('fill',fill);
  t.setAttribute('text-anchor','middle');
  t.textContent=text;
  svg.appendChild(t);
}

// ═══════════════════════════════════════════════════════
// EDIT MODAL
// ═══════════════════════════════════════════════════════
function openModal(t){
  editingTable=t;
  document.getElementById('m-name').value=t.name;
  document.getElementById('m-color').value=t.color;
  renderFieldRows(t.fields);
  document.getElementById('modal-title').textContent='Edit — '+t.name;
  document.getElementById('modal-overlay').classList.add('open');
}

function renderFieldRows(fields){
  const cont=document.getElementById('m-fields');
  cont.innerHTML='';
  fields.forEach((f,i)=>{
    const row=document.createElement('div');
    row.className='field-edit-row';
    row.innerHTML=`
      <input value="${f.name}" placeholder="field_name" onchange="updateField(${i},'name',this.value)">
      <select onchange="updateField(${i},'type',this.value)">
        ${['VARCHAR','TEXT','INT','DECIMAL','BOOLEAN','TIMESTAMP','UUID','JSON'].map(t=>
          `<option${t===f.type?' selected':''}>${t}</option>`).join('')}
      </select>
      <select onchange="updateField(${i},'key',this.value)">
        ${['','PK','FK','UK'].map(k=>`<option${k===f.key?' selected':''}>${k}</option>`).join('')}
      </select>
      <input value="${f.note||''}" placeholder="note..." onchange="updateField(${i},'note',this.value)" style="max-width:120px;">
      <button class="del-field" onclick="removeField(${i})">✕</button>`;
    cont.appendChild(row);
  });
}

function updateField(i,key,val){
  if(editingTable) editingTable.fields[i][key]=val;
}
function removeField(i){
  if(editingTable){ editingTable.fields.splice(i,1); renderFieldRows(editingTable.fields); }
}
function addFieldRow(){
  if(editingTable){
    editingTable.fields.push({name:'new_field',type:'VARCHAR',key:'',note:''});
    renderFieldRows(editingTable.fields);
  }
}
function saveModal(){
  if(editingTable){
    editingTable.name=document.getElementById('m-name').value.toUpperCase().replace(/ /g,'_');
    editingTable.id=editingTable.name;
    editingTable.color=document.getElementById('m-color').value;
  }
  closeModal(); renderAll();
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  editingTable=null;
}
function deleteTable(){
  if(!editingTable) return;
  if(!confirm('Delete table '+editingTable.name+'?')) return;
  tables=tables.filter(t=>t.id!==editingTable.id);
  relations=relations.filter(r=>r.from!==editingTable.id&&r.to!==editingTable.id);
  closeModal(); renderAll();
}

// ═══════════════════════════════════════════════════════
// ADD TABLE / RELATION
// ═══════════════════════════════════════════════════════
function addTable(){
  const name=prompt('Table name (e.g. NEW_TABLE):','NEW_TABLE');
  if(!name) return;
  const id=name.toUpperCase().replace(/ /g,'_');
  tables.push({
    id, name:id, color:'#1f6feb',
    x: (-cam.x/cam.z)+100+Math.random()*200,
    y: (-cam.y/cam.z)+80+Math.random()*100,
    fields:[
      {name:'id',        type:'VARCHAR',  key:'PK', note:'Primary key'},
      {name:'created_at',type:'TIMESTAMP',key:'',   note:''},
    ]
  });
  renderAll();
}

function addRelation(){
  addingRelation=!addingRelation; relFrom=null;
  document.querySelectorAll('.er-table').forEach(el=>el.classList.remove('selected'));
  alert(addingRelation
    ? 'Click the FROM table, then the TO table to draw a relation.'
    : 'Relation mode cancelled.');
  if(!addingRelation) renderAll();
}

// ═══════════════════════════════════════════════════════
// AUTO LAYOUT
// ═══════════════════════════════════════════════════════
function autoLayout(){
  const positions = {
    CITIZEN:          {x:  60, y: 80},
    COMPLAINT:        {x: 400, y: 80},
    CATEGORY:         {x:  60, y:480},
    DESTINATION_ZONE: {x: 760, y: 80},
    STAFF:            {x: 400, y:540},
    NOTIFICATION:     {x:  60, y:700},
    EMERGENCY_CONTACT:{x:1080, y: 80},
    PUBLIC_TOILET:    {x:1080, y:420},
    TOILET_RATING:    {x:1080, y:760},
  };
  tables.forEach(t=>{
    if(positions[t.id]){ t.x=positions[t.id].x; t.y=positions[t.id].y; }
  });
  renderAll();
}

// EXPORT PNG

  alert('To export: right-click the diagram → "Save page as" or use browser Print → Save as PDF. Full PNG export requires a server-side tool like Puppeteer.');
}

// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('load',()=>{
  resetView();
  renderAll();
  // re-render lines after tables have actual sizes
  setTimeout(()=>{ svg.innerHTML=''; tables.forEach(renderTable); relations.forEach(renderRelation); }, 80);
});
window.addEventListener('resize', renderAll);
</script>
